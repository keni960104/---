# 本機測試用 Mosquitto 設定
# 啟動方式: mosquitto -c mosquitto.conf -v

# 一般 MQTT (TCP) listener，監聽所有網卡的 1883 port
listener 1883 0.0.0.0
protocol mqtt

# MQTT over WebSocket listener，瀏覽器版賓果就是連這個 port
# 監聽所有網卡的 9001 port，區網內其他人的手機/電腦瀏覽器都能連
listener 9001 0.0.0.0
protocol websockets

# 教學/作業用途，先不做帳號密碼驗證
allow_anonymous true

# 不需要持久化訊息到硬碟
persistence false
